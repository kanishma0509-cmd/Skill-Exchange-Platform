<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requests · Skill Exchange</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a class="brand" href="dashboard.html">Skill Exchange</a>
  <nav>
    <a href="dashboard.html">My Profile</a>
    <a href="browse.html">Browse</a>
    <a href="requests.html">Requests</a>
    <a href="#" id="logoutLink">Log out</a>
  </nav>
</div>

<div class="container">
  <h2>Received requests</h2>
  <div id="error" class="error-msg"></div>
  <div id="receivedList">Loading...</div>

  <h2 style="margin-top:36px;">Sent requests</h2>
  <div id="sentList">Loading...</div>
</div>

<!-- Rating form, shown inline when rating an exchange -->
<div class="container narrow" id="ratingFormWrap" style="display:none;">
  <div class="card">
    <h3>Rate this exchange</h3>
    <div id="rateError" class="error-msg"></div>
    <form id="ratingForm">
      <input type="hidden" id="ratingRequestId">
            <div class="form-group">
        <label>Stars</label>
        <div id="starPicker" style="font-size:1.8rem; user-select:none;">
          <span class="star-item" data-value="1" style="cursor:pointer; color:#DDE3DD;">★</span><span class="star-item" data-value="2" style="cursor:pointer; color:#DDE3DD;">★</span><span class="star-item" data-value="3" style="cursor:pointer; color:#DDE3DD;">★</span><span class="star-item" data-value="4" style="cursor:pointer; color:#DDE3DD;">★</span><span class="star-item" data-value="5" style="cursor:pointer; color:#DDE3DD;">★</span>
        </div>
        <input type="hidden" id="stars" required>
      </div>
      <div class="form-group">
        <label for="comment">Comment (optional)</label>
        <textarea id="comment" maxlength="500"></textarea>
      </div>
      <button type="submit" class="btn btn-amber">Submit rating</button>
      <button type="button" class="btn btn-outline" id="cancelRating">Cancel</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/requests.js"></script>
</body>
</html>
