<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up · Skill Exchange</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html">Skill Exchange</a>
  <nav><a href="login.html">Log in</a></nav>
</div>

<div class="container narrow">
  <div class="card">
    <h2>Create your account</h2>
    <div id="error" class="error-msg"></div>
    <form id="signupForm">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" minlength="6" required>
        <p class="hint">At least 6 characters.</p>
      </div>
      <button type="submit" class="btn btn-amber">Create account</button>
    </form>
        <p class="hint" style="margin-top:16px;">Already have an account? <a href="login.html">Log in</a></p>
    <p class="hint" id="emailTakenHint" style="display:none; margin-top:8px;">Tip: if this email is already registered, try <a href="login.html">logging in</a> instead.</p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
